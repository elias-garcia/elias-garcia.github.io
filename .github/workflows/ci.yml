name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The accessibility check and Lighthouse run in Google Chrome.
      - run: npx playwright install chrome
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run html
      # Internal links and their anchors, without the network. /projects is
      # projects.html in dist.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --root-dir ${{ github.workspace }}/dist
            --fallback-extensions html
            --no-progress
            'dist/**/*.html'
      - run: npm run a11y
      - run: npm run lighthouse
