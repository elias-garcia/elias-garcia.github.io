post:
  # A post's reading time: in its header, on Writing and on its share image.
  readingTime: "{minutes} min read"
  # The copy buttons: Copy page at the top of a post, Copy on each code block.
  # A button's label turns to `copied` for a moment after copying.
  copyPage: Copy page
  copyPageName: Copy page as Markdown
  copyCode: Copy
  codeName: "{language} code"
  # The label of a code block whose fence names no language (it has no
  # header bar).
  plainCodeName: Code
  copyCodeName: "Copy {language} code"
  copied: Copied
  # When the browser refuses the copy; the button grows to fit it.
  copyFailed: Couldn't copy
